<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Agent Test</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #f4f4f4;
      height: 100vh;
      display: flex;
      justify-content: center;
    }

    .container {
      width: 700px;
      max-width: 95%;
      height: 100vh;
      background: white;
      display: flex;
      flex-direction: column;
    }

    header {
      padding: 20px;
      background: #111827;
      color: white;
    }

    header h2 {
      margin: 0;
    }

    #messages {
      flex: 1;
      overflow-y: auto;
      padding: 20px;
    }

    .message {
      margin-bottom: 15px;
      padding: 12px 15px;
      border-radius: 10px;
      max-width: 80%;
      white-space: pre-wrap;
    }

    .user {
      background: #2563eb;
      color: white;
      margin-left: auto;
    }

    .agent {
      background: #e5e7eb;
      color: #111827;
      margin-right: auto;
    }

    .approval {
      background: #fff7ed;
      border: 2px solid #f97316;
      padding: 15px;
      border-radius: 10px;
      margin-bottom: 15px;
    }

    .approval h3 {
      margin-top: 0;
    }

    .approval button {
      padding: 10px 18px;
      border: none;
      border-radius: 6px;
      cursor: pointer;
      margin-right: 8px;
    }

    .approve {
      background: #16a34a;
      color: white;
    }

    .reject {
      background: #dc2626;
      color: white;
    }

    .input-area {
      display: flex;
      gap: 10px;
      padding: 15px;
      border-top: 1px solid #ddd;
    }

    #messageInput {
      flex: 1;
      padding: 12px;
      border: 1px solid #ccc;
      border-radius: 8px;
      outline: none;
    }

    #sendBtn {
      padding: 12px 20px;
      border: none;
      border-radius: 8px;
      background: #2563eb;
      color: white;
      cursor: pointer;
    }

    #sendBtn:disabled {
      background: #9ca3af;
    }
  </style>
</head>

<body>

  <div class="container">

    <header>
      <h2>Buba Agent Test</h2>
      <small>FastAPI Agent Interface</small>
    </header>

    <div id="messages"></div>

    <div class="input-area">
      <input id="messageInput" type="text" placeholder="Talk to your agent...">

      <button id="sendBtn">
        Send
      </button>
    </div>

  </div>


  <script>

    // ==========================================
    // YOUR FASTAPI SERVER
    // ==========================================

    const API_URL = "http://127.0.0.1:8000";


    // ==========================================
    // CREATE A THREAD ID
    // ==========================================

    function generateUUID() {
        if (window.crypto && crypto.randomUUID) {
          return crypto.randomUUID();
        }
        // Fallback for non-secure contexts
        return 'xxxxxxxx-xxxx-4xxx-yxxx-xxxxxxxxxxxx'.replace(/[xy]/g, function (c) {
          const r = Math.random() * 16 | 0;
          const v = c === 'x' ? r : (r & 0x3 | 0x8);
          return v.toString(16);
        });
      }

      let threadId = localStorage.getItem("agent_thread_id");

      if (!threadId) {
        threadId = generateUUID();
        localStorage.setItem("agent_thread_id", threadId);
      }


    // ==========================================
    // ELEMENTS
    // ==========================================

    const messages = document.getElementById("messages");

    const input = document.getElementById(
      "messageInput"
    );

    const sendBtn = document.getElementById(
      "sendBtn"
    );


    // ==========================================
    // ADD MESSAGE TO UI
    // ==========================================

    function addMessage(text, type) {

      const message = document.createElement("div");

      message.className = `message ${type}`;

      message.textContent = text;

      messages.appendChild(message);

      messages.scrollTop = messages.scrollHeight;
    }


    // ==========================================
    // SEND MESSAGE TO AGENT
    // ==========================================

    async function sendMessage() {

      const message = input.value.trim();

      if (!message) {
        return;
      }

      addMessage(
        message,
        "user"
      );

      input.value = "";

      sendBtn.disabled = true;

      try {

        const response = await fetch(
          `${API_URL}/chat`,
          {
            method: "POST",

            headers: {
              "Content-Type": "application/json"
            },

            body: JSON.stringify({
              message: message,
              thread_id: threadId
            })
          }
        );


        const data = await response.json();

        console.log(
          "CHAT RESPONSE:",
          data
        );


        // ==================================
        // HITL APPROVAL
        // ==================================

        if (
          data.status === "approval_required"
        ) {

          showApproval(
            data.approval
          );

          return;
        }


        // ==================================
        // NORMAL RESPONSE
        // ==================================

        if (data.message) {

          addMessage(
            data.message,
            "agent"
          );

        } else {

          addMessage(
            JSON.stringify(
              data,
              null,
              2
            ),
            "agent"
          );
        }

      }

      catch (error) {

        console.error(error);

        addMessage(
          "Could not connect to the API.",
          "agent"
        );
      }

      finally {

        sendBtn.disabled = false;

        input.focus();
      }
    }


    // ==========================================
    // SHOW APPROVAL REQUEST
    // ==========================================

    function showApproval(approval) {

      const box =
        document.createElement("div");

      box.className = "approval";


      let details = "";


      // Display all approval information

      for (
        const [key, value]
        of Object.entries(approval)
      ) {

        details += `
                <p>
                    <strong>
                        ${key}:
                    </strong>

                    ${value}
                </p>
            `;
      }


      box.innerHTML = `

            <h3>
                🔴 Approval Required
            </h3>

            ${details}

            <button
                class="approve"
                onclick="sendApproval('approve', this)"
            >
                Approve
            </button>

            <button
                class="reject"
                onclick="sendApproval('reject', this)"
            >
                Reject
            </button>

        `;


      messages.appendChild(box);

      messages.scrollTop =
        messages.scrollHeight;
    }


    // ==========================================
    // APPROVE / REJECT
    // ==========================================

    async function sendApproval(
      decision,
      button
    ) {

      button.disabled = true;


      try {

        const response = await fetch(
          `${API_URL}/approval`,
          {
            method: "POST",

            headers: {
              "Content-Type":
                "application/json"
            },

            body: JSON.stringify({

              thread_id: threadId,

              decision: decision

            })
          }
        );


        const data =
          await response.json();


        console.log(
          "APPROVAL RESPONSE:",
          data
        );


        // ==============================
        // ANOTHER APPROVAL
        // ==============================

        if (
          data.status ===
          "approval_required"
        ) {

          showApproval(
            data.approval
          );

          return;
        }


        // ==============================
        // FINAL RESPONSE
        // ==============================

        if (data.message) {

          addMessage(
            data.message,
            "agent"
          );

        } else {

          addMessage(
            JSON.stringify(
              data,
              null,
              2
            ),
            "agent"
          );
        }

      }

      catch (error) {

        console.error(error);

        addMessage(
          "Error sending approval.",
          "agent"
        );
      }
    }


    // ==========================================
    // BUTTON
    // ==========================================

    sendBtn.addEventListener(
      "click",
      sendMessage
    );


    // ==========================================
    // ENTER KEY
    // ==========================================

    input.addEventListener(
      "keydown",
      function (event) {

        if (
          event.key === "Enter"
        ) {

          sendMessage();
        }
      }
    );

  </script>

</body>

</html>
